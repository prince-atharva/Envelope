# Local infrastructure for Envelope powered by HealthProHub (docs/04: "Docker Compose:
# Postgres, Redis, MinIO"). Email is not here: it goes through real SMTP (Gmail),
# configured in .env.
#
#   docker compose up -d        start everything
#   docker compose ps           all services should be "healthy"
#   docker compose down         stop (data is kept in named volumes)
#   docker compose down -v      stop and DELETE all local data
#
# IMPORTANT: `name:` is pinned. Without it, Compose names the project after this
# directory ("digital signature"), which other projects on this machine already
# used; `up` could then recreate containers that are not ours. Never remove it.
#
# Every port is bound to 127.0.0.1 so nothing is reachable from the network, and
# the host ports are chosen to avoid the older signflow_* containers.
name: digitalsign

services:
  postgres:
    image: postgres:16-alpine
    container_name: digitalsign_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: digitalsign
      POSTGRES_PASSWORD: digitalsign_dev_password
      POSTGRES_DB: digitalsign
      # Password for the restricted runtime role created by docker/postgres/init.
      APP_DB_PASSWORD: digitalsign_app_dev_password
    # pg_stat_statements: per-query timing/call-count stats, read with
    # `SELECT * FROM pg_stat_statements`, once CREATE EXTENSION has run in a
    # given database (docker/postgres/init does this for a fresh volume; an
    # existing one needs it run by hand once). track_io_timing adds real
    # read/write timings to EXPLAIN (ANALYZE, BUFFERS) (100M-row scale
    # follow-up, docs/16 step 14).
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - track_io_timing=on
    ports:
      - '127.0.0.1:5545:5432'
    volumes:
      - digitalsign_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U digitalsign -d digitalsign']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: digitalsign_redis
    restart: unless-stopped
    # BullMQ needs noeviction: an evicted key is a lost job. AOF keeps queued
    # jobs across restarts.
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '127.0.0.1:6391:6379'
    volumes:
      - digitalsign_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # S3-compatible stand-in for Cloudflare R2 / AWS S3. Pinned: MinIO no longer
    # publishes new community images, so `latest` will not move anyway.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: digitalsign_minio
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: digitalsign
      MINIO_ROOT_PASSWORD: digitalsign_dev_password
    ports:
      - '127.0.0.1:9102:9000' # S3 API
      - '127.0.0.1:9103:9001' # Web console
    volumes:
      - digitalsign_minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  # One-off job: creates the document buckets, then exits. Safe to re-run.
  # The *-sealed buckets hold finished documents under Object Lock (ADR 0007),
  # which can only be switched on when a bucket is created.
  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: digitalsign_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 digitalsign digitalsign_dev_password &&
      mc mb --ignore-existing local/digitalsign-documents &&
      mc mb --ignore-existing local/digitalsign-test &&
      mc mb --ignore-existing --with-lock local/digitalsign-documents-sealed &&
      mc mb --ignore-existing --with-lock local/digitalsign-test-sealed &&
      mc anonymous set none local/digitalsign-documents &&
      mc anonymous set none local/digitalsign-documents-sealed
      "

volumes:
  digitalsign_postgres_data:
  digitalsign_redis_data:
  digitalsign_minio_data:
